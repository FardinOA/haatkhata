name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bechakena
          POSTGRES_PASSWORD: bechakena
          POSTGRES_DB: bechakena
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U bechakena" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx vitest run --project unit
      - run: npx vitest run --project server
      - run: npm run build
        env:
          DATABASE_URL: postgres://bechakena:bechakena@localhost:55433/bechakena
          AUTH_SECRET: ci-only-secret
